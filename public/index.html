<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>DARK WEB — Digital Store</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background:#050505;
  color:#fff;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* ======================================================
   HEADER
====================================================== */

header{
  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:14px 20px;

  background:
    rgba(5,5,5,.96);

  border-bottom:
    1px solid #222;

  backdrop-filter:
    blur(10px);
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#00ff88;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav button{
  border:1px solid #333;
  background:#111;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
}

.nav button:hover{
  border-color:#00ff88;
  color:#00ff88;
}

/* ======================================================
   MAIN
====================================================== */

main{
  max-width:1200px;
  margin:auto;
  padding:25px 16px 80px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* ======================================================
   HERO
====================================================== */

.hero{
  padding:50px 10px;
  text-align:center;
}

.hero h1{
  font-size:
    clamp(38px,8vw,76px);

  margin:0;

  letter-spacing:5px;
}

.hero h1 span{
  color:#00ff88;
}

.hero p{
  color:#aaa;
  max-width:700px;
  margin:20px auto;
  line-height:1.7;
}

.powered{
  color:#00ff88;
  font-weight:bold;
  letter-spacing:2px;
}

/* ======================================================
   STORE
====================================================== */

.section-title{
  margin:25px 0;
  font-size:28px;
}

.products{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        230px,
        1fr
      )
    );
  gap:18px;
}

.product{
  background:#0d0d0d;
  border:1px solid #222;
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  border-color:#00ff88;
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#151515;
}

.product-body{
  padding:16px;
}

.product h3{
  margin-top:0;
}

.product p{
  color:#aaa;
  min-height:45px;
  line-height:1.5;
}

.price{
  font-size:21px;
  font-weight:bold;
  color:#00ff88;
  margin:12px 0;
}

.crypto-price{
  color:#aaa;
  font-size:14px;
}

/* ======================================================
   BUTTONS
====================================================== */

.btn{
  width:100%;
  border:0;
  padding:12px;
  border-radius:9px;
  background:#00ff88;
  color:#000;
  font-weight:bold;
}

.btn:hover{
  filter:brightness(1.1);
}

.btn.secondary{
  background:#1b1b1b;
  color:#fff;
  border:1px solid #333;
}

.btn.danger{
  background:#ff3333;
  color:#fff;
}

.btn + .btn{
  margin-top:8px;
}

/* ======================================================
   AUTH
====================================================== */

.auth-box{
  max-width:430px;
  margin:50px auto;
  background:#0d0d0d;
  border:1px solid #222;
  padding:25px;
  border-radius:15px;
}

.auth-box h2{
  text-align:center;
}

.auth-switch{
  text-align:center;
  margin-top:15px;
  color:#aaa;
}

.auth-switch button{
  background:none;
  border:0;
  color:#00ff88;
}

/* ======================================================
   FORMS
====================================================== */

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  color:#aaa;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #333;
  background:#090909;
  color:#fff;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#00ff88;
}

textarea{
  min-height:110px;
  resize:vertical;
}

/* ======================================================
   ORDERS
====================================================== */

.orders{
  display:grid;
  gap:15px;
}

.order{
  background:#0d0d0d;
  border:1px solid #222;
  padding:18px;
  border-radius:12px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.order-number{
  color:#00ff88;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#222;
  font-size:12px;
}

.status.paid,
.status.delivered{
  color:#00ff88;
}

.status.pending,
.status.verification_pending{
  color:#ffd84d;
}

.status.failed,
.status.rejected,
.status.cancelled{
  color:#ff5555;
}

/* ======================================================
   ADMIN
====================================================== */

.admin-grid{
  display:grid;
  grid-template-columns:
    minmax(280px,380px)
    1fr;
  gap:20px;
}

.panel{
  background:#0d0d0d;
  border:1px solid #222;
  border-radius:15px;
  padding:20px;
}

.panel h3{
  margin-top:0;
}

.admin-products,
.admin-orders{
  display:grid;
  gap:12px;
}

.admin-card{
  border:1px solid #282828;
  padding:14px;
  border-radius:10px;
  background:#111;
}

.admin-card img{
  width:90px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
}

/* ======================================================
   MODAL
====================================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:2000;

  display:none;
  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.82);

  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  max-height:92vh;
  overflow:auto;

  background:#0d0d0d;
  border:1px solid #333;
  border-radius:15px;

  padding:22px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  background:#222;
  color:#fff;
  width:35px;
  height:35px;
  border-radius:50%;
}

/* ======================================================
   PAYMENT
====================================================== */

.payment-box{
  margin-top:15px;
  padding:15px;
  border:1px solid #292929;
  border-radius:10px;
  background:#090909;
}

.wallet{
  word-break:break-all;
  color:#00ff88;
  padding:10px;
  background:#111;
  border-radius:7px;
}

.notice{
  background:#171717;
  border-left:3px solid #00ff88;
  padding:12px;
  color:#aaa;
  line-height:1.5;
}

/* ======================================================
   TOAST
====================================================== */

#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);

  z-index:5000;

  background:#00ff88;
  color:#000;

  padding:12px 18px;
  border-radius:8px;

  font-weight:bold;

  display:none;

  max-width:
    calc(100% - 30px);

  text-align:center;
}

#toast.show{
  display:block;
}

/* ======================================================
   MOBILE
====================================================== */

@media(max-width:700px){

  header{
    align-items:flex-start;
    gap:10px;
    flex-direction:column;
  }

  .nav{
    width:100%;
  }

  .nav button{
    flex:1;
  }

  .admin-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding:35px 5px;
  }

  main{
    padding-top:10px;
  }
}

</style>

</head>

<body>

<header>

  <div class="logo">
    DARK <span>WEB</span>
  </div>

  <nav class="nav">

    <button
      onclick="showPage('store')"
    >
      STORE
    </button>

    <button
      id="ordersNav"
      class="hidden"
      onclick="showPage('orders')"
    >
      ORDERS
    </button>

    <button
      id="adminNav"
      class="hidden"
      onclick="showPage('admin')"
    >
      ADMIN
    </button>

    <button
      id="authNav"
      onclick="showPage('auth')"
    >
      LOGIN
    </button>

    <button
      id="logoutBtn"
      class="hidden"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </nav>

</header>

<main>

<!-- =====================================================
     STORE
===================================================== -->

<section
  id="storePage"
  class="page active"
>

  <div class="hero">

    <h1>
      DARK <span>WEB</span>
    </h1>

    <p>
      Premium digital products delivered
      securely after payment.
    </p>

    <div class="powered">
      POWERED BY DARK WEB
    </div>

  </div>

  <h2 class="section-title">
    Digital Products
  </h2>

  <div
    id="products"
    class="products"
  ></div>

</section>

<!-- =====================================================
     AUTH
===================================================== -->

<section
  id="authPage"
  class="page"
>

  <div class="auth-box">

    <h2 id="authTitle">
      LOGIN
    </h2>

    <form
      id="authForm"
      onsubmit="submitAuth(event)"
    >

      <div
        id="nameGroup"
        class="form-group hidden"
      >

        <label>
          Full Name
        </label>

        <input
          id="name"
          type="text"
          autocomplete="name"
        />

      </div>

      <div class="form-group">

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          required
          autocomplete="email"
        />

      </div>

      <div class="form-group">

        <label>
          Password
        </label>

        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        />

      </div>

      <button
        id="authSubmit"
        class="btn"
        type="submit"
      >
        LOGIN
      </button>

    </form>

    <div class="auth-switch">

      <span id="authQuestion">
        Don't have an account?
      </span>

      <button
        onclick="toggleAuth()"
        id="authToggle"
      >
        REGISTER
      </button>

    </div>

  </div>

</section>

<!-- =====================================================
     ORDERS
===================================================== -->

<section
  id="ordersPage"
  class="page"
>

  <h2 class="section-title">
    MY ORDERS
  </h2>

  <div
    id="orders"
    class="orders"
  ></div>

</section>

<!-- =====================================================
     ADMIN
===================================================== -->

<section
  id="adminPage"
  class="page"
>

  <h2 class="section-title">
    ADMIN PANEL
  </h2>

  <div class="admin-grid">

    <!-- ADD PRODUCT -->

    <div class="panel">

      <h3>
        ADD PRODUCT
      </h3>

      <form
        id="productForm"
        onsubmit="addProduct(event)"
      >

        <div class="form-group">

          <label>
            Product Name
          </label>

          <input
            id="productName"
            required
          />

        </div>

        <div class="form-group">

          <label>
            KSh Price
          </label>

          <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            required
          />

        </div>

        <div class="form-group">

          <label>
            Binance / USDT Price
          </label>

          <input
            id="productBinance"
            placeholder="Example: 5 USDT"
          />

        </div>

        <div class="form-group">

          <label>
            Description
          </label>

          <textarea
            id="productDescription"
          ></textarea>

        </div>

        <div class="form-group">

          <label>
            Delivery Content
          </label>

          <textarea
            id="deliveryContent"
            placeholder="Content delivered to customer after payment."
          ></textarea>

        </div>

        <div class="form-group">

          <label>
            Product Image
          </label>

          <input
            id="productImage"
            type="file"
            accept="image/*"
          />

        </div>

        <button
          class="btn"
          type="submit"
        >
          ADD PRODUCT
        </button>

      </form>

    </div>

    <!-- ADMIN DATA -->

    <div>

      <div class="panel">

        <h3>
          PRODUCTS
        </h3>

        <div
          id="adminProducts"
          class="admin-products"
        ></div>

      </div>

      <br>

      <div class="panel">

        <h3>
          ORDERS
        </h3>

        <div
          id="adminOrders"
          class="admin-orders"
        ></div>

      </div>

    </div>

  </div>

</section>

</main>

<!-- =====================================================
     CHECKOUT MODAL
===================================================== -->

<div
  id="checkoutModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        CHECKOUT
      </h2>

      <button
        class="close"
        onclick="closeModal('checkoutModal')"
      >
        ×
      </button>

    </div>

    <div id="checkoutProduct"></div>

    <hr>

    <div class="form-group">

      <label>
        Delivery Email / Target
      </label>

      <input
        id="deliveryTarget"
        placeholder="Email or delivery destination"
      />

    </div>

    <div class="form-group">

      <label>
        Phone
      </label>

      <input
        id="customerPhone"
        placeholder="07XXXXXXXX"
      />

    </div>

    <div class="form-group">

      <label>
        Payment Method
      </label>

      <select
        id="paymentMethod"
        onchange="paymentMethodChanged()"
      >

        <option value="mpesa">
          M-Pesa
        </option>

        <option value="binance">
          Binance / USDT
        </option>

      </select>

    </div>

    <div
      id="paymentInstructions"
      class="payment-box"
    ></div>

    <button
      class="btn"
      onclick="createOrder()"
    >
      CONTINUE PAYMENT
    </button>

  </div>

</div>

<!-- =====================================================
     ORDER MODAL
===================================================== -->

<div
  id="orderModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        ORDER
      </h2>

      <button
        class="close"
        onclick="closeModal('orderModal')"
      >
        ×
      </button>

    </div>

    <div
      id="orderDetails"
    ></div>

  </div>

</div>

<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast"></div>

<script>

/* ======================================================
   STATE
====================================================== */

let currentUser = null;

let authRegister = false;

let selectedProduct = null;

let currentOrder = null;

/* ======================================================
   API
====================================================== */

async function api(
  url,
  options = {}
){

  const response =
    await fetch(
      url,
      {
        credentials:
          "include",

        ...options,

        headers:{
          ...(options.body instanceof FormData
            ? {}
            : {
                "Content-Type":
                  "application/json"
              }),

          ...(options.headers || {})
        }
      }
    );

  let data;

  try{
    data =
      await response.json();
  }catch{
    data = {
      success:false,
      message:
        "Invalid server response."
    };
  }

  if(
    !response.ok &&
    !data.message
  ){

    data.message =
      "Request failed.";
  }

  return data;
}

/* ======================================================
   TOAST
====================================================== */

function alertUser(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(
    () => {
      toast.classList.remove(
        "show"
      );
    },
    3000
  );
}

/* ======================================================
   PAGE NAVIGATION
====================================================== */

function showPage(
  page
){

  const pages = [
    "store",
    "auth",
    "orders",
    "admin"
  ];

  pages.forEach(
    name => {

      const element =
        document.getElementById(
          name + "Page"
        );

      if(element){

        element.classList.toggle(
          "active",
          name === page
        );
      }
    }
  );

  if(
    page === "orders"
  ){

    if(!currentUser){

      showPage("auth");
      return;
    }

    loadOrders();
  }

  if(
    page === "admin"
  ){

    if(
      !currentUser ||
      Number(
        currentUser.is_admin
      ) !== 1
    ){

      showPage("auth");
      return;
    }

    loadAdminProducts();
    loadAdminOrders();
  }

  window.scrollTo(
    0,
    0
  );
}

/* ======================================================
   NAVIGATION UPDATE
====================================================== */

function updateNav(){

  const adminNav =
    document.getElementById(
      "adminNav"
    );

  const ordersNav =
    document.getElementById(
      "ordersNav"
    );

  const authNav =
    document.getElementById(
      "authNav"
    );

  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );

  if(currentUser){

    ordersNav.classList.remove(
      "hidden"
    );

    logoutBtn.classList.remove(
      "hidden"
    );

    authNav.classList.add(
      "hidden"
    );

    if(
      Number(
        currentUser.is_admin
      ) === 1
    ){

      adminNav.classList.remove(
        "hidden"
      );

    }else{

      adminNav.classList.add(
        "hidden"
      );
    }

  }else{

    ordersNav.classList.add(
      "hidden"
    );

    adminNav.classList.add(
      "hidden"
    );

    logoutBtn.classList.add(
      "hidden"
    );

    authNav.classList.remove(
      "hidden"
    );
  }
}

/* ======================================================
   AUTH TOGGLE
====================================================== */

function toggleAuth(){

  authRegister =
    !authRegister;

  document
    .getElementById(
      "authTitle"
    )
    .textContent =
      authRegister
        ? "REGISTER"
        : "LOGIN";

  document
    .getElementById(
      "authSubmit"
    )
    .textContent =
      authRegister
        ? "CREATE ACCOUNT"
        : "LOGIN";

  document
    .getElementById(
      "nameGroup"
    )
    .classList.toggle(
      "hidden",
      !authRegister
    );

  document
    .getElementById(
      "name"
    ).required =
      authRegister;

  document
    .getElementById(
      "authQuestion"
    )
    .textContent =
      authRegister
        ? "Already have an account?"
        : "Don't have an account?";

  document
    .getElementById(
      "authToggle"
    )
    .textContent =
      authRegister
        ? "LOGIN"
        : "REGISTER";
}

/* ======================================================
   LOGIN / REGISTER
====================================================== */

async function submitAuth(
  event
){

  event.preventDefault();

  const name =
    document
      .getElementById(
        "name"
      )
      .value
      .trim();

  const email =
    document
      .getElementById(
        "email"
      )
      .value
      .trim();

  const password =
    document
      .getElementById(
        "password"
      )
      .value;

  const endpoint =
    authRegister
      ? "/api/register"
      : "/api/login";

  const body =
    authRegister
      ? {
          name,
          email,
          password
        }
      : {
          email,
          password
        };

  const data =
    await api(
      endpoint,
      {
        method:"POST",
        body:
          JSON.stringify(
            body
          )
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "Authentication failed."
    );

    return;
  }

  currentUser =
    data.user;

  updateNav();

  alertUser(
    "Welcome, " +
    currentUser.name
  );

  /*
     IMPORTANT:
     ADMIN -> ADMIN PANEL
     CUSTOMER -> STORE
  */

  if(
    Number(
      currentUser.is_admin
    ) === 1
  ){

    showPage(
      "admin"
    );

  }else{

    showPage(
      "store"
    );
  }

  document
    .getElementById(
      "authForm"
    )
    .reset();

  if(authRegister){

    authRegister =
      false;

    toggleAuth();
  }
}

/* ======================================================
   LOGOUT
====================================================== */

async function logout(){

  await api(
    "/api/logout",
    {
      method:"POST"
    }
  );

  currentUser =
    null;

  updateNav();

  showPage(
    "store"
  );

  alertUser(
    "Logged out."
  );
}

/* ======================================================
   LOAD PRODUCTS
====================================================== */

async function loadProducts(){

  const data =
    await api(
      "/api/products"
    );

  const container =
    document.getElementById(
      "products"
    );

  if(!data.success){

    container.innerHTML =
      "<p>Could not load products.</p>";

    return;
  }

  if(
    !data.products.length
  ){

    container.innerHTML =
      `
        <div class="notice">
          No products available yet.
        </div>
      `;

    return;
  }

  container.innerHTML =
    data.products
      .map(
        product => {

          const image =
            product.image_url
              ? `
                <img
                  class="product-image"
                  src="${escapeHtml(
                    product.image_url
                  )}"
                  alt="${escapeHtml(
                    product.name
                  )}"
                >
              `
              : `
                <div
                  class="product-image"
                  style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#00ff88;
                    font-size:30px;
                  "
                >
                  DARK WEB
                </div>
              `;

          return `
            <div class="product">

              ${image}

              <div class="product-body">

                <h3>
                  ${escapeHtml(
                    product.name
                  )}
                </h3>

                <p>
                  ${escapeHtml(
                    product.description ||
                    ""
                  )}
                </p>

                <div class="price">
                  KSh ${Number(
                    product.price_kes ||
                    0
                  ).toLocaleString()}
                </div>

                ${
                  product.binance_price
                    ? `
                      <div class="crypto-price">
                        ${escapeHtml(
                          product.binance_price
                        )}
                      </div>
                    `
                    : ""
                }

                <br>

                <button
                  class="btn"
                  onclick="openCheckout(${product.id})"
                >
                  BUY NOW
                </button>

              </div>

            </div>
          `;
        }
      )
      .join("");
}

/* ======================================================
   OPEN CHECKOUT
====================================================== */

async function openCheckout(
  productId
){

  if(!currentUser){

    showPage(
      "auth"
    );

    alertUser(
      "Please login before buying."
    );

    return;
  }

  const data =
    await api(
      "/api/products"
    );

  if(!data.success){
    return;
  }

  selectedProduct =
    data.products.find(
      p =>
        Number(p.id) ===
        Number(productId)
    );

  if(!selectedProduct){
    alertUser(
      "Product not found."
    );
    return;
  }

  document
    .getElementById(
      "checkoutProduct"
    )
    .innerHTML =
      `
        <h3>
          ${escapeHtml(
            selectedProduct.name
          )}
        </h3>

        <div class="price">
          KSh ${Number(
            selectedProduct.price_kes
          ).toLocaleString()}
        </div>
      `;

  document
    .getElementById(
      "deliveryTarget"
    )
    .value =
      currentUser.email;

  document
    .getElementById(
      "customerPhone"
    )
    .value = "";

  document
    .getElementById(
      "paymentMethod"
    )
    .value =
      "mpesa";

  paymentMethodChanged();

  document
    .getElementById(
      "checkoutModal"
    )
    .classList.add(
      "show"
    );
}

/* ======================================================
   PAYMENT METHOD
====================================================== */

async function paymentMethodChanged(){

  const method =
    document
      .getElementById(
        "paymentMethod"
      )
      .value;

  const box =
    document
      .getElementById(
        "paymentInstructions"
      );

  if(
    method === "mpesa"
  ){

    box.innerHTML =
      `
        <div class="notice">
          Enter your M-Pesa phone number.
          After continuing, an STK Push will
          be sent to your phone.
        </div>
      `;

  }else{

    const data =
      await api(
        "/api/payment/binance"
      );

    box.innerHTML =
      `
        <div class="notice">
          Send the exact USDT amount shown below
          to the configured wallet, then submit
          your transaction hash.
        </div>

        <br>

        <strong>
          Network:
        </strong>

        ${escapeHtml(
          data.network ||
          "TRC20"
        )}

        <br><br>

        <strong>
          Wallet:
        </strong>

        <div class="wallet">
          ${escapeHtml(
            data.wallet ||
            "Wallet not configured yet."
          )}
        </div>
      `;
  }
}

/* ======================================================
   CREATE ORDER
====================================================== */

async function createOrder(){

  if(!selectedProduct){

    alertUser(
      "No product selected."
    );

    return;
  }

  const deliveryTarget =
    document
      .getElementById(
        "deliveryTarget"
      )
      .value
      .trim();

  const phone =
    document
      .getElementById(
        "customerPhone"
      )
      .value
      .trim();

  const paymentMethod =
    document
      .getElementById(
        "paymentMethod"
      )
      .value;

  if(!deliveryTarget){

    alertUser(
      "Enter delivery email/target."
    );

    return;
  }

  if(
    paymentMethod === "mpesa" &&
    !phone
  ){

    alertUser(
      "Enter your M-Pesa phone number."
    );

    return;
  }

  const data =
    await api(
      "/api/orders",
      {
        method:"POST",

        body:
          JSON.stringify({
            product_id:
              selectedProduct.id,

            payment_method:
              paymentMethod,

            delivery_method:
              "email",

            delivery_target:
              deliveryTarget,

            phone
          })
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "Could not create order."
    );

    return;
  }

  currentOrder =
    data.order;

  if(
    paymentMethod === "mpesa"
  ){

    await startMpesaPayment();

  }else{

    closeModal(
      "checkoutModal"
    );

    showBinanceInstructions();
  }
}

/* ======================================================
   M-PESA PAYMENT
====================================================== */

async function startMpesaPayment(){

  const phone =
    document
      .getElementById(
        "customerPhone"
      )
      .value
      .trim();

  const data =
    await api(
      "/api/orders/" +
      currentOrder.id +
      "/mpesa",
      {
        method:"POST",

        body:
          JSON.stringify({
            phone
          })
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "M-Pesa payment failed."
    );

    return;
  }

  closeModal(
    "checkoutModal"
  );

  alertUser(
    "M-Pesa STK Push sent. Complete payment on your phone."
  );

  setTimeout(
    () => {
      showOrder(
        currentOrder.id
      );
    },
    1500
  );
}

/* ======================================================
   BINANCE
====================================================== */

function showBinanceInstructions(){

  const modal =
    document.getElementById(
      "orderModal"
    );

  const details =
    document.getElementById(
      "orderDetails"
    );

  details.innerHTML =
    `
      <div class="notice">

        <strong>
          Order:
        </strong>

        ${escapeHtml(
          currentOrder.order_number
        )}

        <br><br>

        Send:

        <strong>
          ${escapeHtml(
            currentOrder.amount_crypto ||
            "the exact USDT amount"
          )}
        </strong>

        <br><br>

        After payment, enter your
        transaction hash below.

      </div>

      <br>

      <div class="form-group">

        <label>
          Binance Transaction Hash
        </label>

        <input
          id="binanceTxid"
          placeholder="Paste TXID / transaction hash"
        >

      </div>

        class="btn"

async function submitBinanceTxid(){

  const txid =
    document
      .getElementById(
        "binanceTxid"
      )
      .value
      .trim();

  if(!txid){

    alertUser(
      "Enter the transaction hash."
    );

    return;
  }

  const data =
    await api(
      "/api/orders/" +
      currentOrder.id +
      "/binance",
      {
        method:"POST",

        body:
          JSON.stringify({
            txid
          })
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "Could not submit transaction."
    );

    return;
  }

  closeModal(
    "orderModal"
  );

  alertUser(
    "Transaction submitted for verification."
  );

  loadOrders();
}

/* ======================================================
   LOAD CUSTOMER ORDERS

/* ======================================================
   SHOW ORDER
====================================================== */

      id
    );

      data.message ||

    );

    .getElementById(
      "orderDetails"
    )

        <h3>
          ${escapeHtml(
            data.order.product_name
          )}
        </h3>

        <div class="notice">

          <strong>
            Order:
          </strong>

          ${escapeHtml(
            data.order.order_number
          )}

          <br><br>

          Payment:
          ${escapeHtml(
            data.order.payment_status
          )}

          <br>

          Delivery:
          ${escapeHtml(

                <br><br>

                Delivery status:
                <strong>
                  ${escapeHtml(
                    data.order.delivery_status

/* ======================================================
   ADD PRODUCT
====================================================== */

async function addProduct(
  event
){

  event.preventDefault();

  const formData =
    new FormData();

  formData.append(
    "name",
    document
      .getElementById(
        "productName"
      )
      .value
  );

  formData.append(
    "price_kes",
    document
      .getElementById(
        "productPrice"
      )
      .value
  );

  formData.append(
    "binance_price",
    document
      .getElementById(
        "productBinance"
      )
      .value
  );

  formData.append(
    "description",
    document
      .getElementById(
        "productDescription"
      )
      .value
  );

  formData.append(
    "delivery_content",
    document
      .getElementById(
        "deliveryContent"
      )
      .value
  );

  const image =
    document
      .getElementById(
        "productImage"
      )
      .files[0];

  if(image){

    formData.append(
      "image",
      image
    );
  }

  const data =
    await api(
      "/api/admin/products",
      {
        method:"POST",
        body:
          formData
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "Could not add product."
    );

    return;
  }

  document
    .getElementById(
      "productForm"
    )
    .reset();

  alertUser(
    "Product added."
  );

  loadAdminProducts();
  loadProducts();
}

/* ======================================================
   TOGGLE PRODUCT
====================================================== */

async function toggleProduct(
  id
){

  const data =
    await api(
      "/api/admin/products/" +
      id +
      "/toggle",
      {
        method:"POST"
      }

  if(!data.success){

    alertUser(
      data.message ||
      "Could not update product."
    );

    return;
  }

  loadProducts();
}

/* ======================================================
   DELETE PRODUCT
====================================================== */

async function deleteProduct(
  id
){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

  }

  const data =
    await api(
      "/api/admin/products/" +
      id,
      {
        method:"DELETE"
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "Could not delete product."
    );

    return;
  }

  alertUser(
    "Product deleted."
  );

  loadAdminProducts();
  loadProducts();
}

/* ======================================================
   VERIFY BINANCE
====================================================== */

async function verifyBinance(
  id,
  approved
){

  const data =
    await api(
      "/api/admin/orders/" +
      id +
      "/binance-verify",
      {
        method:"POST",

        body:
          JSON.stringify({
            approved
          })
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "Could not update payment."
    );

    return;
  }

  alertUser(
    approved
      ? "Payment approved."
      : "Payment rejected."
  );

  loadAdminOrders();
}

/* ======================================================
   DELIVERY
====================================================== */

async function updateDelivery(
  id
){

  const status =
    document
      .getElementById(
        "delivery-" +
        id
      )
      .value;

  const notes =
    document
      .getElementById(
        "notes-" +
        id
      )
      .value;

  const data =
    await api(
      "/api/admin/orders/" +
      id +
      "/delivery",
      {
        method:"POST",

        body:
          JSON.stringify({
            status,
            notes
          })
      }
    );

  if(!data.success){

    alertUser(
      data.message ||
      "Could not update delivery."
    );

    return;
  }

  alertUser(
    "Delivery updated."
  );

  loadAdminOrders();
}

/* ======================================================
   MODALS
====================================================== */

function closeModal(
  id
){

  document
    .getElementById(
      id
    )
    .classList.remove(
      "show"
    );
}

document
  .querySelectorAll(
    ".modal"
  )
  .forEach(
    modal => {

      modal.addEventListener(
        "click",
        event => {

          if(
            event.target ===
            modal
          ){

            modal.classList.remove(
              "show"
            );
          }
        }
      );
    }
  );

/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

/* ======================================================
   INIT
====================================================== */

async function init(){

  const data =
    await api(
      "/api/me"
    );

  if(
    data.success &&
    data.user
  ){

    currentUser =
      data.user;

    updateNav();

    /*
      If an already logged-in admin
      refreshes the page, keep them
      on the admin panel.
    */

    if(
      Number(
        currentUser.is_admin
      ) === 1
    ){

      showPage(
        "admin"
      );

    }else{

      showPage(
        "store"
      );
    }

  }else{

    currentUser =
      null;

    updateNav();

    showPage(
      "store"
    );
  }

  loadProducts();
}

/* ======================================================
   START
====================================================== */

init();
